label{display:block;font-weight:600;font-size:.9rem;margin:10px 0 3px}

a{color:var(--pri)}

.ev-nav select{width:auto}
.bk{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
#lock{display:none}

body.locked #lock{display:flex;min-height:100vh;min-height:100dvh;align-items:center;justify-content:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lockcard{width:100%;max-width:380px;background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--pri);border-radius:16px;padding:28px 22px 24px;display:flex;flex-direction:column}
.lockday{margin:0 0 6px;color:var(--muted);font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
#lockt{font-family:var(--display);font-weight:400;font-size:3.4rem;line-height:1.3;margin:0 0 8px;text-transform:none;text-wrap:balance;background-image:linear-gradient(to bottom,transparent calc(100% - 13px),var(--rule) calc(100% - 13px),var(--rule) calc(100% - 12px),transparent calc(100% - 12px));background-size:100% 1.3em}
.lockcard .sub{margin:0 0 8px}
#lockmsg{min-height:1.4em;margin:8px 0 10px;color:var(--dng);font-size:.9rem}
#lockgo{width:100%;padding:11px 14px}
#lockgo:disabled{opacity:.6}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .25s}}
</style>

</section>

    Object.assign(b.ar[0],{E:`Domina la lectura en lletra de pal i també en lligada. És capaç de comprendre paraules, oracions i textos quan llegeix. És capaç d'escriure per si {sol|sola} paraules, frases i textos sense faltes d'ortografia. Es fixa molt en com s'escriuen les paraules. Fa molt bona cal·ligrafia. Té bones habilitats comunicatives quan parla en català.`,N:`Domina la lectura en lletra de pal i s'ha iniciat en la lectura en lligada. És capaç de comprendre paraules i oracions quan llegeix. És capaç d'escriure per si {sol|sola} i ha millorat molt la cal·ligrafia.`,S:`Cada cop llegeix paraules i petites oracions en lletra de pal amb més fluïdesa, però cal continuar treballant la lectura. Comprèn el que llegeix sobretot paraules, frases encara costen una mica. És capaç d'escriure paraules per si {sol|sola}.`,X:`Li costa comprendre el que llegeix. És capaç d'escriure per si {sol|sola} frases, però encara omet o substitueix alguns sons. Cal continuar treballant en la lectura.`});

    Object.assign(b.ar[3],{E:`Ha demostrat un bon assoliment en les competències matemàtiques treballades. Domina el càlcul i sentit numèric (ordenació i comptatge) fins números amb centena. Ha entès amb facilitat els conceptes de mesura i geometria treballats. Resol amb èxit problemes visuals de suma i resta.`,N:`Ha demostrat un bon assoliment en les competències matemàtiques treballades. Domina el càlcul i sentit numèric (ordenació i comptatge) fins el 20. Ha entès amb facilitat els conceptes de mesura i geometria treballats. Resol amb èxit problemes visuals de suma i resta.`,S:`Ha comèncat a fer càlculs i resolucions de problemes amb més dificultat.`,X:`Comença a dominar el càlcul i sentit numèric (ordenació i comptatge) fins el 20. Cal fer-ho de manera visual. Ha entès amb facilitat els conceptes de mesura i geometria treballats. Encara li costa resoldre problemes visuals de suma i resta.`});

      P(0,`És capaç de comprendre oracions i textos quan llegeix. Escriu per si {sol|sola} frases i aplica normes ortogràfiques quan escriu. Es nota un progrés en l'aplicació de normes com l'ús de majúscules i punts. Fa bona cal·ligrafia en lletra lligada.`,`És capaç de comprendre oracions i textos breus quan llegeix. Escriu per si {sol|sola} frases i aplica algunes normes d'ortografia en paraules d'ús comú quan escriu. És important que comenci a aplicar normes com l'ús de majúscules i punts. Fa bona cal·ligrafia en lletra lligada.`,`A vegades li costa comprendre el que llegeix, sobretot quan són textos breus. És capaç d'escriure per si {sol|sola} frases, però encara omet o substitueix alguns sons. Cal que comenci a fixar-se com s'escriuen paraules d'ús habitual per no fer faltes d'ortografia i comenci a incorporar l'ús de majúscules i punts quan escriu oracions. Fa bona cal·ligrafia en lletra lligada. Cal continuar treballant en la lectura perquè cada vegada sigui més fluïda.`,`Presenta dificultats en el reconeixement de les lletres i continua sense relacionar el so amb la grafia. És important seguir treballant la consciència fonològica.`);

      P(3,`Mostra destresa en la suma i la resta de nombres de dues xifres. Col·loca els nombres de manera precisa a la recta numèrica, els compara amb seguretat i els descompon adequadament. Identifica i escriu correctament els nombres dictats. Ordena correctament els dies de la setmana i els mesos de l'any. Resol amb encert problemes de suma i resta, seleccionant les operacions adequades segons la situació.`,`Demostra un domini adequat de la suma i la resta de nombres de dues xifres, tot i que en ocasions necessita revisar els càlculs. Situa els nombres correctament a la recta numèrica, els compara i els descompon de manera satisfactòria. Identifica i escriu els nombres dictats amb precisió. Ordena els dies de la setmana i els mesos de l'any de manera correcta. Resol problemes de suma i resta escollint les operacions adequades, encara que de vegades requereix suport per interpretar l'enunciat.`,`Presenta dificultats en la suma i la resta de nombres de dues xifres i necessita reforçar l'estratègia de càlcul. Requereix suport per situar els nombres a la recta numèrica, comparar-los i descompondre'ls correctament. Mostra inseguretat en la identificació i l'escriptura de nombres dictats. Necessita més pràctica per ordenar els dies de la setmana i els mesos de l'any. Requereix acompanyament en la resolució de problemes de suma i resta per seleccionar les operacions adequades.`);
      P(4,`Mostra una gran curiositat pel món dels éssers vius i planteja preguntes constants sobre les funcions vitals i els ecosistemes. A més, gaudeix col·laborant en les tasques d'observació en equip. Ha assimilat amb molta facilitat tots els continguts sobre la classificació dels regnes treballats aquest trimestre.`,`Mostra molt d'interès per la matèria i formula preguntes sobre les temàtiques dels projectes. A més, gaudeix de la feina en equip. Ha comprès amb facilitat tots els continguts treballats aquest trimestre.`,`Cal que mostri més interès pel funcionament dels éssers vius. Encara està en procés d'assolir alguns continguts sobre les característiques dels grups de vertebrats treballats aquest trimestre.`,`Ha adquirit part del vocabulari dels projectes, tot i que alguns conceptes encara no els domina completament. Gaudeix treballant en grup amb els seus companys i companyes.`);

    }else{
      Object.assign(b.in,{E:`{n} ha fet un bon recorregut al llarg d'aquest primer curs de primària. Ha crescut tant a nivell acadèmic com personal, adquirint nous aprenentatges i desenvolupant una actitud cada vegada més autònoma i responsable. Durant aquest tercer trimestre ha mantingut una actitud molt positiva envers l'aprenentatge: treballa amb constància, participa activament a classe i mostra interès per tot allò que fa. Ha consolidat els continguts treballats al llarg del curs i ha fet un bon progrés personal i acadèmic.`,N:`Aquest tercer trimestre, {n} ha mostrat una bona actitud i constància en el treball. Ha anat consolidant de manera progressiva els aprenentatges i ha millorat en aquells aspectes que li resultaven més difícils. A classe es mostra {participatiu|participativa} i amb ganes d'aprendre, i això es reflecteix en el seu progrés.`,S:`Al llarg d'aquest tercer trimestre, {n} ha continuat esforçant-se per superar les dificultats que es presenten en alguns àmbits de l'aprenentatge. Tot i que encara hi ha aspectes a reforçar, especialment en lectura i expressió escrita, el seu esforç ha estat constant. És {un alumne|una alumna} que no es rendeix i mostra ganes de millorar.`});b.in.X=b.in.S;

      P(0,`És capaç de comprendre oracions i textos quan llegeix. Escriu frases de manera autònoma i aplica correctament normes ortogràfiques bàsiques. Fa una cal·ligrafia clara i acurada en lletra lligada. Separa correctament les paraules en síl·labes, identifica i empra amb encert algunes famílies de paraules, i utilitza l'article dins l'oració. Redacta oracions amb majúscula inicial i punt final de manera autònoma i coherent. L'evolució al llarg del curs ha estat excel·lent.`,`És capaç de comprendre oracions i textos breus quan llegeix. Escriu frases de manera autònoma i aplica algunes normes ortogràfiques en paraules d'ús habitual. Fa bona cal·ligrafia en lletra lligada. Identifica les síl·labes en paraules senzilles, però encara comet errors puntuals. Comença a reconèixer i usar famílies de paraules, tot i que necessita suport. Empra articles en frases simples, però cal que en consolidi l'ús. Cal continuar incidint en la construcció d'oracions completes amb majúscula i punt. L'evolució al llarg del curs ha estat adequada.`,`A vegades té dificultats per comprendre textos breus. Escriu frases de manera autònoma, però encara omet o substitueix alguns sons. Cal que es fixi en com s'escriuen paraules d'ús freqüent i comenci a incorporar l'ús correcte de majúscules i punts. Fa bona cal·ligrafia en lletra lligada. Cal continuar reforçant la lectura per millorar la fluïdesa. Té dificultats per separar paraules en síl·labes i necessita suport per fer-ho. Encara no identifica famílies de paraules amb autonomia.`,`S'esforça en comunicar-se oralment en català, tot i que sol iniciar les converses en castellà. En l'escriptura, només fa còpies en lletra de pal seguint un model. Presenta dificultats en el reconeixement de les lletres i encara no relaciona el so amb la grafia. És fonamental continuar treballant la consciència fonològica. L'evolució al llarg del curs ha estat progressiva.`);

      P(3,`Mostra una bona destresa en la suma i la resta de nombres de dues xifres i en la suma de tres nombres d'una xifra. També resol amb encert sumes portant-ne, tot i que de manera guiada. Situa correctament els nombres a la recta numèrica fins al 99, fa comptatges endavant, enrere i de dos en dos, i els compara i ordena amb seguretat. Identifica els nombres anteriors i posteriors, descompon correctament els nombres fins al 99 i escriu sense errors els nombres dictats. Diferencia nombres parells i senars, i utilitza amb encert monedes i bitllets d'euro. Reconeix diversos polígons, els seus costats i vèrtexs. Resol de manera autònoma problemes orals i escrits de suma i resta, escollint bé les operacions segons la situació.`,`Demostra un bon domini de la suma i la resta de dues xifres, tot i que de vegades necessita revisar els càlculs o fer-ho amb suport. És capaç de fer la suma de tres nombres d'una xifra i comença a comprendre la suma portant-ne. Situa els nombres a la recta numèrica fins al 99, fa comptatges i és capaç de comparar i ordenar els nombres, tot i que de vegades comet errors puntuals. Coneix els nombres anteriors i posteriors, descompon correctament la major part dels nombres i escriu amb precisió els nombres dictats. Distingeix parells i senars i reconeix les monedes i bitllets més habituals. Identifica alguns polígons i sap comptar costats i vèrtexs amb ajuda. Participa activament en la resolució de problemes de suma i resta, tot i que a vegades necessita suport per entendre l'enunciat.`,`Comença a consolidar les estratègies de suma i resta de dues xifres, però encara necessita suport freqüent per fer càlculs correctes. La suma de tres nombres d'una xifra es fa amb ajuda, i la suma portant-ne encara no està adquirida. Té dificultats per situar els nombres a la recta numèrica i per fer comptatges ordenats. En la resolució de problemes, cal acompanyament per entendre què se li demana i escollir l'operació correcta.`,`Presenta dificultats en la suma i la resta de dues xifres, i requereix ajuda constant per aplicar estratègies de càlcul. No ha adquirit la suma portant-ne ni la suma de tres nombres d'una xifra. Mostra dificultats per situar els nombres a la recta numèrica, fer comptatges, comparar, ordenar i descompondre nombres. En la resolució de problemes necessita suport constant per interpretar els enunciats i escollir les operacions adequades.`);

const PROMPT=`Eres un asistente que prepara la programación de aula de un maestro o maestra de Primaria para importarla en una app.
Te adjunto en este mensaje (o en los siguientes) algunos de estos archivos: mi horario (foto, PDF o Excel) y los libros del profesorado o los índices de mis asignaturas.

Devuélveme SOLO un bloque de código JSON, sin explicaciones antes ni después, con esta forma:
{"tipo":"programacion-aula","horario":{...},"unidades":[...],"recursos":[...]}
Incluye "horario" solo si te he pasado mi horario, y "unidades" solo si te he pasado libros o índices.

HORARIO
"horario":{"franjas":["9:00","10:00","11:00"],"celdas":[{"dia":"lunes","hora":"9:00","clase":"Matemàtiques","asignatura":"mates","tipo":"clase"}]}
- "franjas": hora de inicio de cada franja, en orden. "dia": lunes, martes, miércoles, jueves o viernes. "hora": una de las "franjas".

- "asignatura" (solo en las clases): mates, medi, cat, cas, angl, mus, plas, ef, val, tut u oral. Si es otra, inventa una clave corta en minúsculas y añade "asignatura_nombre".

- "paginas": primera y última página de la unidad según el índice. En "saltar", las páginas que te diga que no se trabajan. "por": páginas por sesión (2 si no te digo nada).
- Si el libro no va por páginas, en lugar de "paginas" usa "sesiones": ["sesión 1…","sesión 2…"].
- "repaso", "ficha" y "control": true si al final de cada unidad hay repaso, ficha de repaso y control.

RECURSOS (opcional)
{"titulo":"Avaluació 360º Matemàtiques 5è","tipo":"Material","asignatura":"Matemàtiques 5è","nota":"Control de la unidad 1 en la pág. 18"}

  try{const r=await fetch("/api/assistant",{method:"POST",cache:"no-store",headers:hdr({"content-type":"application/json"}),body:JSON.stringify({pregunta:q,contexto:aiContext(),historial:AIH})});
    if(r.status===401){lock("No se ha podido comprobar tu cuenta: puede que la contraseña haya cambiado o que la cuenta esté desactivada. Vuelve a entrar.");return}
    const j=await r.json().catch(()=>({}));
    if(!r.ok){const u=safeUrl(j.url||"");out.innerHTML=`<p class="hint" style="color:var(--dng)">${esc(aiErr(j.error))}</p>${u?`<p class="hint"><a href="${esc(u)}" target="_blank" rel="noopener">Abrir la página de Vercel para activarlo</a></p>`:""}${j.detalle?`<p class="hint">Detalle técnico: ${esc(j.detalle)}</p>`:""}`;return}
    let p;try{const t=j.texto||"",a=t.indexOf("{"),b=t.lastIndexOf("}");p=JSON.parse(t.slice(a,b+1))}catch(x){p={respuesta:j.texto||"",acciones:[]}}
    AIH=AIH.concat([{role:"user",content:q},{role:"assistant",content:String(j.texto||"").slice(0,4000)}]).slice(-6);
    const acts=(Array.isArray(p.acciones)?p.acciones:[]).map(aiPrep),ok=acts.filter(x=>!x.err),nok=acts.length-ok.length;aiState=ok;
    out.innerHTML=`<div class="card" style="margin-top:12px">${p.respuesta?`<p style="margin:0 0 8px;white-space:pre-wrap">${esc(p.respuesta)}</p>`:""}${ok.length?`<b>Cambios propuestos</b>${ok.map((o,i)=>`<label class="ses"><input type="checkbox" data-ai="${i}" checked><span>${esc(o.d)}</span></label>`).join("")}<div class="row" style="margin-top:10px"><button class="pri" type="button" id="aiapply">Aplicar cambios</button></div>`:""}${nok?`<p class="hint">${nok===1?"Una propuesta no era válida y se ha descartado.":nok+" propuestas no eran válidas y se han descartado."}</p>`:""}</div>`;
    if(ok.length)$("#aiapply").onclick=aiApply;$("#aiq").value=""}
  catch(x){out.innerHTML=`<p class="hint" style="color:var(--dng)">Sin conexión. El asistente necesita internet.</p>`}
  finally{go.disabled=false;go.textContent="Enviar"}}
function aiApply(){const sel=[...document.querySelectorAll("[data-ai]")].filter(c=>c.checked).map(c=>aiState[+c.dataset.ai]).filter(Boolean);if(!sel.length)return;
  const before=JSON.stringify({S,C});sel.forEach(o=>{try{o.run()}catch(e){console.error(e)}});save();render();
  $("#aiout").innerHTML=`<div class="card" style="margin-top:12px"><b>${sel.length===1?"Cambio aplicado.":sel.length+" cambios aplicados."}</b><div class="row" style="margin-top:8px"><button class="btn" type="button" id="aiundo">Deshacer</button></div></div>`;
  $("#aiundo").onclick=()=>{const b=JSON.parse(before);S=b.S;C=b.C;save();render();$("#aiout").innerHTML=`<p class="hint">Cambios deshechos.</p>`}}
// Pantalla de bienvenida: la app no se muestra hasta comprobar la contraseña.
async function hashPw(p){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("progaula:"+p));return Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return ""}}
function lock(msg){SY.pw="";SY.ready=false;try{sessionStorage.removeItem("progaula-clave");sessionStorage.removeItem("progaula-me")}catch(e){}
  const m=$("#modal");m.classList.remove("on");m.innerHTML="";
  const T=new Date();$("#lockday").textContent=DIA[wd(T)]+" "+T.getDate()+" de "+MES[T.getMonth()];
  const ln=lsGet("progaula-lastname");$("#lockt").textContent=ln?`¡Hola ${ln}!`:"¡Hola!";$("#lockuser").value=lsGet("progaula-lastuser");
  document.body.classList.add("locked");$("#lockmsg").textContent=msg||"";$("#lockpw").value="";setTimeout(()=>($("#lockuser").value?$("#lockpw"):$("#lockuser")).focus(),50)}
function acctUI(){$("[data-acc]").hidden=!SY.admin;$("[data-mypw]").hidden=SY.env;$("#aibtn").hidden=!SY.ai}
function unlock(me,pw){Object.assign(SY,{user:me.id,name:me.name,admin:!!me.admin,ai:!!me.ai,env:!!me.env,pw,ready:false});
  try{sessionStorage.setItem("progaula-clave",pw);sessionStorage.setItem("progaula-me",JSON.stringify(me))}catch(e){}
  lsSet("progaula-lastuser",me.id);lsSet("progaula-lastname",me.name);lsSet("progaula-me:"+me.id,JSON.stringify(me));
  loadLocal();applySeeds();acctUI();document.body.classList.remove("locked");tab="hoy";av="hoy";dOff=0;render();window.scrollTo(0,0)}
$("#lockf").onsubmit=async e=>{e.preventDefault();const user=$("#lockuser").value.trim().toLowerCase(),pw=$("#lockpw").value,go=$("#lockgo"),msg=$("#lockmsg");if(!user||!pw)return;
  go.disabled=true;msg.textContent="";go.textContent="Comprobando…";
  try{const r=await fetch("/api/users?yo=1",{cache:"no-store",headers:{"x-user":user,"x-clave":pw}});
    if(r.status===401){msg.textContent="El usuario o la contraseña no son correctos.";$("#lockpw").select();return}
    if(!r.ok){let j={};try{j=await r.json()}catch(x){}msg.textContent=j.error==="sin_clave"?"Falta poner la contraseña en Vercel (APP_PASSWORD).":"No se ha podido conectar con el servidor. Inténtalo de nuevo.";return}
    const me=await r.json(),h=await hashPw(user+":"+pw);if(h)lsSet("progaula-h:"+user,h);
    unlock(me,pw);pull()}
  catch(x){const h=await hashPw(user+":"+pw),saved=lsGet("progaula-h:"+user),me=JSON.parse(lsGet("progaula-me:"+user)||"null");
    if(h&&saved&&h===saved&&me){unlock(me,pw);status("Sin conexión. Ves la copia guardada en este dispositivo; los cambios se subirán al volver la conexión.",1)}
    else msg.textContent="Sin conexión. Conéctate a internet para entrar."}
  finally{go.disabled=false;go.textContent="Entrar"}};
async function pullCal(){if(!SY.pw||CY.busy)return;CY.busy=true;let push2=false;
  try{const r=await fetch("/api/calendar",{cache:"no-store",headers:hdr()});if(r.status===401){lock("No se ha podido comprobar tu cuenta: puede que la contraseña haya cambiado o que la cuenta esté desactivada. Vuelve a entrar.");return}if(!r.ok)return;const j=await r.json();
    if(CY.dirty&&j.rev===CY.rev)push2=true;
    else{const before=JSON.stringify(C),lost=CY.dirty;C=normCal(j.data);CY.rev=j.rev;CY.last=JSON.stringify(C);CY.dirty=false;keepCal();if(before!==CY.last&&shown())render();if(lost)status("Alguien había cambiado el calendario común y se ha cargado su versión. Si tu cambio no aparece, vuelve a hacerlo.",1)}}
  catch(e){}finally{CY.busy=false}if(push2)pushCal()}
async function pushCal(){if(!SY.pw||!CY.dirty)return;if(CY.busy){CY.again=true;return}CY.busy=true;
  try{const snap=JSON.stringify(C),r=await fetch("/api/calendar",{method:"PUT",cache:"no-store",headers:hdr({"content-type":"application/json"}),body:JSON.stringify({rev:CY.rev,data:C})});
    if(r.status===409){const j=await r.json();C=normCal(j.data);CY.rev=j.rev;CY.last=JSON.stringify(C);CY.dirty=false;keepCal();if(shown())render();status("Alguien había cambiado el calendario común y se ha cargado su versión. Si tu cambio no aparece, vuelve a hacerlo.",1)}
    else if(r.ok){const j=await r.json();CY.rev=j.rev;CY.last=snap;CY.dirty=JSON.stringify(C)!==snap;keepCal()}}
  catch(e){}finally{CY.busy=false}if(CY.again){CY.again=false;pushCal()}}
// Cuentas: Carlota (administradora) crea las de sus compañeros; cada uno puede cambiar su contraseña.
const accErr=e=>({usuario_no_valido:"El usuario solo puede tener minúsculas, números y guiones (de 2 a 20 caracteres).",usuario_existe:"Ya existe una cuenta con ese usuario.",sin_nombre:"Escribe el nombre.",clave_corta:"La contraseña tiene que tener al menos 6 caracteres.",clave_en_vercel:"Esta contraseña se cambia en Vercel (APP_PASSWORD).",no_a_ti:"No puedes desactivar tu propia cuenta.",sin_permiso:"Solo la administradora puede hacer esto."})[e]||"No se ha podido guardar. Comprueba la conexión.";
const usersCall=(method,body)=>fetch("/api/users",{method,cache:"no-store",headers:hdr(body?{"content-type":"application/json"}:{}),body:body?JSON.stringify(body):undefined});
async function accountsUI(msg){const m=$("#modal");
  m.innerHTML=`<div class="sheet"><h3>Cuentas</h3><p class="hint">Cada compañero entra con su usuario y su contraseña y solo ve sus datos. El calendario del cole es común: cualquiera puede editarlo y lo ven todos.</p><p id="accmsg" class="hint" role="status">${esc(msg||"Cargando…")}</p><div id="acclist"></div>
  <form id="accnew" style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)"><b>Nueva cuenta</b>
  <label for="an_n">Nombre</label><input id="an_n" required placeholder="Ej. Marta">
  <label for="an_u">Usuario</label><input id="an_u" required autocapitalize="none" spellcheck="false" placeholder="Ej. marta">
  <label for="an_p">Contraseña inicial</label><input id="an_p" required minlength="6" placeholder="Mínimo 6 caracteres">
  <label class="ses" style="font-weight:400;margin-top:10px"><input type="checkbox" id="an_ai"><span>Puede usar el asistente de IA</span></label>
  <div class="row"><button class="pri" type="submit">Crear cuenta</button><button class="btn" type="button" id="accclose">Cerrar</button></div></form></div>`;
  m.classList.add("on");$("#accclose").onclick=()=>{m.classList.remove("on");m.innerHTML=""};
  $("#accnew").onsubmit=async e=>{e.preventDefault();try{const r=await usersCall("POST",{accion:"crear",nombre:$("#an_n").value,id:$("#an_u").value.trim().toLowerCase(),clave:$("#an_p").value,ia:$("#an_ai").checked});const j=await r.json().catch(()=>({}));
    if(!r.ok){$("#accmsg").textContent=accErr(j.error);return}accountsUI(`Cuenta creada. Pásale a ${j.cuenta.name} su usuario («${j.cuenta.id}») y la contraseña inicial; podrá cambiarla al entrar.`)}catch(x){$("#accmsg").textContent=accErr()}};
  try{const r=await usersCall("GET");const j=await r.json();if(!r.ok){$("#accmsg").textContent=accErr(j.error);return}if(!msg)$("#accmsg").textContent="";
    $("#acclist").innerHTML=j.cuentas.map(c=>`<div class="bk" style="align-items:flex-start"><div style="min-width:0"><b>${esc(c.name)}</b> <span class="muted">· ${esc(c.id)}${c.admin?" · administradora":""}${c.activo?"":" · desactivada"}</span><div class="muted">IA: ${c.ai?"sí":"no"}</div></div>
      <div class="row" style="justify-content:flex-end;gap:4px 10px">${c.propia?`<button class="lnk" type="button" data-ua="clave" data-uid="${esc(c.id)}">Nueva contraseña</button>`:""}<button class="lnk" type="button" data-ua="ia" data-uid="${esc(c.id)}" data-v="${c.ai?0:1}">${c.ai?"Quitar IA":"Dar IA"}</button>${c.id!==SY.user?`<button class="lnk" type="button" data-ua="activo" data-uid="${esc(c.id)}" data-v="${c.activo?0:1}">${c.activo?"Desactivar":"Activar"}</button>`:""}</div></div>`).join("");
    $("#acclist").onclick=async e=>{const b=e.target.closest("[data-ua]");if(!b)return;const ac=b.dataset.ua,id=b.dataset.uid;let body={accion:ac,id};
      if(ac==="clave"){const row=b.closest(".bk");if(!row.querySelector(".npw")){const f=document.createElement("div");f.className="npw";f.style.cssText="width:100%;margin-top:6px";f.innerHTML=`<label for="np_${esc(id)}">Nueva contraseña para ${esc(id)}</label><div class="row"><input id="np_${esc(id)}" minlength="6" style="flex:1;width:auto"><button class="btn" type="button" data-ua="clave2" data-uid="${esc(id)}">Guardar</button></div>`;row.style.flexWrap="wrap";row.appendChild(f)}return}
      if(ac==="clave2")body={accion:"clave",id,clave:$("#np_"+id).value};
      if(ac==="ia")body.ia=b.dataset.v==="1";if(ac==="activo")body.activo=b.dataset.v==="1";
      if(ac==="activo"&&b.dataset.v==="0"&&!b.dataset.ok){b.dataset.ok="1";b.textContent="¿Seguro? Pulsa otra vez";return}
      try{const r=await usersCall("POST",body);const j=await r.json().catch(()=>({}));if(!r.ok){$("#accmsg").textContent=accErr(j.error);return}
        accountsUI(ac==="clave2"?`Contraseña de ${id} cambiada.`:ac==="ia"?`IA ${body.ia?"activada":"desactivada"} para ${id}.`:`Cuenta ${body.activo?"activada":"desactivada"}.`)}catch(x){$("#accmsg").textContent=accErr()}}}
  catch(x){$("#accmsg").textContent="No se han podido cargar las cuentas. Comprueba la conexión."}}
function myPwUI(){modal("Cambiar contraseña",[{k:"p1",label:"Nueva contraseña",type:"password",req:1,hint:"Mínimo 6 caracteres."},{k:"p2",label:"Repítela",type:"password",req:1}],d=>{
  if(d.p1.length<6){genErr("La contraseña tiene que tener al menos 6 caracteres.");return false}if(d.p1!==d.p2){genErr("Las dos contraseñas no coinciden.");return false}
  usersCall("POST",{accion:"mi_clave",nueva:d.p1}).then(async r=>{if(r.ok){SY.pw=d.p1;try{sessionStorage.setItem("progaula-clave",d.p1)}catch(e){}const h=await hashPw(SY.user+":"+d.p1);if(h)lsSet("progaula-h:"+SY.user,h);status("Contraseña cambiada.")}else{const j=await r.json().catch(()=>({}));status(accErr(j.error),1)}}).catch(()=>status("No se ha podido cambiar la contraseña. Comprueba la conexión.",1));
  return "nosave"})}
window.addEventListener("online",()=>{if(SY.pw)SY.dirty?push():pull()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(SY.dirty){clearTimeout(SY.timer);push()}return}if(shown())render();if(SY.pw)SY.dirty?push():pull()});
if(SY.pw){loadLocal();applySeeds();acctUI();document.body.classList.remove("locked");render();pull()}else lock();
</script>
